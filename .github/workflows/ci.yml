name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # requirements-dev pins everything (including the heavy torch chain);
      # the suite itself runs fully offline with the fake embedder/LLM.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run offline test-suite (integration deselected)
        run: pytest -q
      - name: Validate the evaluation set
        run: python scripts/validate_eval_set.py
      - name: Lint
        run: ruff check rag agent api observability azure_adapters scripts tests
